events {
    worker_connections 1024;
}

http{
   include mime.types;
   server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # --- safety ---
    client_max_body_size 20M;

    # --- staticfiles ---
    location /static/ {
        alias C:/Users/1/PycharmProjects/landing_page/landing/staticfiles/;
    }

    # --- media ---
    location /media/ {
        alias C:/Users/1/PycharmProjects/landing_page/landing/media/;
    }

    # --- main Django ---
    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_redirect off;
        }
    }
}
